version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai_eng_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_engineering
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - "pgdata:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai_eng_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - "redisdata:/data"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ai_eng_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - "qdrantdata:/qdrant/storage"

  backend:
    build:
      context: .
      dockerfile: app/backend/Dockerfile
    container_name: ai_eng_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql://postgres:password@postgres:5432/ai_engineering"
      REDIS_URL: "redis://redis:6379/0"
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
      OLLAMA_MODEL: "llama3.1:latest"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ".:/workspace"

  frontend:
    build:
      context: app/frontend
      dockerfile: Dockerfile
    container_name: ai_eng_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://backend:8000"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
  qdrantdata:
